name: build-groups-relay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install lmdb dev
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 用阿里云 Ubuntu 镜像加速，规避 GitHub runner 访问 archive.ubuntu.com 缓慢
          sudo sed -i 's|archive.ubuntu.com|mirrors.aliyun.com|g; s|security.ubuntu.com|mirrors.aliyun.com|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=8 -o Acquire::http::Timeout=30 install -y --no-install-recommends liblmdb-dev

      - name: Build
        run: |
          go mod tidy
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o groups-relay .
          ls -la groups-relay

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: groups-relay
          path: groups-relay